<!-- Contenitore principale con margine superiore (Bootstrap mt-4) -->
<div class="container mt-4">

  <!-- Card Bootstrap con margine inferiore -->
  <div class="card mb-4">
    <div class="card-body"> <!-- Corpo della card -->

      <!-- Titolo della sezione -->
      <h3>Aggiungi Prodotto</h3>

      <!-- Input per il nome del prodotto, con variabile template #nameInput -->
      <input type="text" placeholder="Nome" #nameInput class="form-control mb-2">

      <!-- Input per il prezzo, tipo numerico -->
      <input type="number" placeholder="Prezzo" #priceInput class="form-control mb-2">

      <!-- Input per la descrizione -->
      <input type="text" placeholder="Descrizione" #descInput class="form-control mb-2">

      <!-- Bottone per aggiungere un prodotto -->
      <button
        class="btn btn-success" <!-- Stile Bootstrap: bottone verde -->
        
        <!-- Evento click:
             - chiama la funzione addProduct passando i valori degli input
             - poi svuota gli input -->
        (click)="addProduct(nameInput.value, priceInput.value, descInput.value); 
                 nameInput.value=''; 
                 priceInput.value=''; 
                 descInput.value=''">
        Aggiungi
      </button>

    </div>
  </div>

  <!-- Titolo della lista prodotti -->
  <h2>Lista Prodotti</h2>

  <!-- Lista Bootstrap -->
  <ul class="list-group">

    <!-- Ciclo Angular:
         *ngFor itera su tutti i prodotti nell'array products -->
    <li *ngFor="let product of products" 
        class="list-group-item d-flex justify-content-between align-items-center">

      <!-- Span cliccabile:
           - mostra nome e prezzo del prodotto
           - al click seleziona il prodotto -->
      <span (click)="selectProduct(product)" style="cursor: pointer;">
        {{ product.name }} - €{{ product.price }} <!-- Interpolazione Angular -->
      </span>

      <!-- Bottone per eliminare il prodotto -->
      <button class="btn btn-danger btn-sm" (click)="deleteProduct(product)">
        Elimina
      </button>

    </li>
  </ul>

  <!-- Componente figlio:
       riceve il prodotto selezionato tramite binding -->
  <app-product-detail [product]="selectedProduct"></app-product-detail>

</div>
