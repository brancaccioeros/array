<!-- Contenitore principale -->
<div class="container mt-4">

  <!-- Card per aggiungere prodotti -->
  <div class="card mb-4">

    <div class="card-body">

      <!-- Titolo -->
      <h3>Aggiungi Prodotto</h3>

      <!-- Input nome -->
      <input
        type="text"
        placeholder="Nome"
        #nameInput
        class="form-control mb-2"
      >

      <!-- Input prezzo -->
      <input
        type="number"
        placeholder="Prezzo"
        #priceInput
        class="form-control mb-2"
      >

      <!-- Input descrizione -->
      <input
        type="text"
        placeholder="Descrizione"
        #descInput
        class="form-control mb-2"
      >

      <!-- Bottone aggiunta -->
      <button
        class="btn btn-success"

        (click)="
          addProduct(
            nameInput.value,
            priceInput.value,
            descInput.value
          );

          nameInput.value = '';

          priceInput.value = '';

          descInput.value = '';
        "
      >
        Aggiungi
      </button>

    </div>

  </div>

  <!-- Titolo lista -->
  <h2>Lista Prodotti</h2>

  <!-- Lista prodotti -->
  <ul class="list-group">

    <!-- Ciclo prodotti -->
    <li

      *ngFor="let product of products"

      class="list-group-item d-flex justify-content-between align-items-center"

      [style.background-color]="
        product.price > 60 ? 'red' : 'white'
      "

    >

      <!-- Area cliccabile -->
      <span

        (click)="selectProduct(product)"

        style="cursor: pointer;"

      >

        <!-- Nome e prezzo -->
        {{ product.name }} - €{{ product.price }}

      </span>

      <!-- Bottone elimina -->
      <button

        class="btn btn-danger btn-sm"

        (click)="deleteProduct(product)"

      >
        Elimina
      </button>

    </li>

  </ul>

  <!-- Dettaglio prodotto selezionato -->
  <app-product-detail
    [product]="selectedProduct">
  </app-product-detail>

</div>
