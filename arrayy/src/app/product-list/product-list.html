<div class="container mt-4">

  <div class="card mb-4">

    <div class="card-body">

      <!-- Titolo della sezione per aggiungere prodotti -->
      <h3>Aggiungi Prodotto</h3>

      <!-- Campo input per il nome del prodotto -->
      <input
        type="text"
        placeholder="Nome"
        #nameInput
        class="form-control mb-2"
      >

      <!-- Campo input per il prezzo del prodotto -->
      <input
        type="number"
        placeholder="Prezzo"
        #priceInput
        class="form-control mb-2"
      >

      <!-- Campo input per la descrizione del prodotto -->
      <input
        type="text"
        placeholder="Descrizione"
        #descInput
        class="form-control mb-2"
      >

      <!-- Pulsante per aggiungere un nuovo prodotto -->
      <button
        class="btn btn-success"
        (click)="
          addProduct(
            nameInput.value,
            priceInput.value,
            descInput.value
          );

          nameInput.value = '';
          priceInput.value = '';
          descInput.value = '';
        "
      >
        Aggiungi
      </button>

    </div>
  </div>

  <!-- Titolo della lista prodotti -->
  <h2>Lista Prodotti</h2>

  <ul class="list-group">

    <!-- Ciclo che mostra tutti i prodotti -->
    <li
      *ngFor="let product of products"
      class="list-group-item d-flex justify-content-between align-items-center"
    >

      <!-- Nome e prezzo del prodotto -->
      <span
        (click)="selectProduct(product)"
        style="cursor: pointer;"
      >
        {{ product.name }} - €{{ product.price }}
      </span>

      <!-- Pulsante per eliminare il prodotto -->
      <button
        class="btn btn-danger btn-sm"
        (click)="deleteProduct(product)"
      >
        Elimina
      </button>

    </li>

  </ul>

  <!-- Dettaglio prodotto selezionato -->
  <app-product-detail
    [product]="selectedProduct">
  </app-product-detail>

</div>
