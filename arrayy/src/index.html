<!-- Dichiara il tipo di documento HTML5 -->
<!doctype html>

<!-- Elemento radice della pagina, lingua impostata su inglese -->
<html lang="en">

<head>
  <!-- Codifica dei caratteri (UTF-8 supporta quasi tutti i caratteri) -->
  <meta charset="utf-8">

  <!-- Titolo della pagina (visibile nella scheda del browser) -->
  <title>Arrayy</title>

  <!-- Base URL per l'app Angular (importante per il routing) -->
  <base href="/">

  <!-- Impostazioni per il responsive design -->
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Icona della pagina (favicon) -->
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <!-- Import di Bootstrap tramite CDN per lo stile -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
  <!-- Componente principale Angular:
       tutto il contenuto dell'app verrà renderizzato qui -->
  <app-root></app-root>
</body>

</html>
